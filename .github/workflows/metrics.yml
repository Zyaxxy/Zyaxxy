# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Schedule updates (daily at midnight UTC)
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: .github/assets/metrics-stats.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata

      - name: Activity Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: .github/assets/metrics-activity.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata

      - name: Repository Metrics
        uses: lowlighter/metrics@latest
        with:
          filename: .github/assets/metrics-repository.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: Zyaxxy
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          plugin_followup: yes
          plugin_languages: yes
          plugin_languages_limit: 5
          plugin_languages_details: percentage
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, Jupyter Notebook
